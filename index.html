*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f4f5f7;color:#111;font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
#app{max-width:760px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
nav{display:flex;gap:6px;padding:10px 0;position:sticky;top:0;background:#f4f5f7;z-index:5}
nav button{flex:1;padding:12px 4px;font-size:16px;border:1px solid #bbb;border-radius:10px;background:#fff}
nav button.on{background:#12355b;color:#fff;border-color:#12355b}
button{font:inherit;border:1px solid #999;background:#fff;border-radius:10px;padding:12px 14px}
button.primary{background:#12355b;color:#fff;border-color:#12355b}
button.big{width:100%;font-size:19px;padding:15px;margin-top:8px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}
.card label{display:block;margin:8px 0}
input,textarea,select{width:100%;margin-bottom:8px;font:inherit;padding:11px;border:1px solid #aaa;border-radius:8px;background:#fff}
input[type=checkbox]{width:auto}
.hint{color:#555;font-size:14px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:8px;width:100%;text-align:left;margin:6px 0;align-items:center}
.row em{color:#0a6;font-style:normal;font-size:14px}
.settings{margin:6px 0 10px}.settings label{display:block;margin:6px 0}
.foot{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.foot button{flex:1}
.bar{display:flex;gap:10px;align-items:center;padding:6px 0}.bar b{font-size:24px}.done{background:#0a6;color:#fff;border-radius:8px;padding:2px 10px;font-weight:700}
.sets{text-align:center;font-size:18px;margin:6px 0}
body[data-rot="90"] #app,body[data-rot="-90"] #app{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;max-width:none;box-sizing:border-box;overflow:auto;transform-origin:0 0}
body[data-rot="90"] #app{transform:rotate(90deg) translateY(-100%)}
body[data-rot="-90"] #app{transform:rotate(-90deg) translateX(-100%)}
body[data-rot="90"] .side,body[data-rot="-90"] .side{min-height:22vw}
nav button.rotb{flex:0 0 52px}
body[data-rot="90"] .num,body[data-rot="-90"] .num{font-size:64px}
body[data-rot="90"] nav,body[data-rot="-90"] nav{padding:4px 0}
body[data-rot="90"] .side,body[data-rot="-90"] .side{padding:6px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:48vh;padding:14px 6px;border:3px solid #12355b;background:#fff;border-radius:16px}
